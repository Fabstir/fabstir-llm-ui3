name: Build Step

on:
  push:
    branches-ignore: ["main"]
  

jobs:  
  build-and-push-docker:
    name: Buiild Docker Image and Push to Docker Repository

    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout Stage
        uses: actions/checkout@v3
      
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ewr.vultrcr.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setting required packages
        run: |
          sudo apt update -y && sudo apt install curl              
          curl -L "${{secrets.SDK_CORE_URL}}" --output fabstir-sdk-core-1.3.36.tgz
          tar -xvzf fabstir-sdk-core-1.3.36.tgz

      - name: Set env
        run: | 
          echo "${{secrets.ENV_FILE}}" > .env.local
    
      - name: Build
        run: docker build .